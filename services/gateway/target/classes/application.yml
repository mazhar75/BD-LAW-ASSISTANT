server:
  port: 8081
  servlet:
    context-path: /

spring:
  application:
    name: bd-law-gateway

  # Database Configuration
  datasource:
    url: jdbc:postgresql://localhost:5432/bdlaw
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 20000

  # JPA Configuration
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false

  # Redis Configuration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      jedis:
        pool:
          max-active: 10
          max-idle: 10
          min-idle: 5
          max-wait: -1ms

  # Cache Configuration
  cache:
    type: redis
    redis:
      time-to-live: 3600000  # 1 hour default TTL
      cache-null-values: false

  # Spring Cloud Gateway Routes
  cloud:
    gateway:
      routes:
        # RAG Service Route
        - id: rag-service
          uri: ${RAG_SERVICE_URL:http://localhost:8000}
          predicates:
            - Path=/api/rag/**
          filters:
            - name: StripPrefix
              args:
                parts: 2
            - name: RateLimit
              args:
                redis-rate-limiter.replenishRate: 100
                redis-rate-limiter.burstCapacity: 200

        # User Service Route (future)
        - id: user-service
          uri: ${USER_SERVICE_URL:http://localhost:8003}
          predicates:
            - Path=/api/users/**
          filters:
            - name: StripPrefix
              args:
                parts: 2

        # Scraping Service Route (future)
        - id: scraping-service
          uri: ${SCRAPING_SERVICE_URL:http://localhost:8004}
          predicates:
            - Path=/api/scraping/**
          filters:
            - name: StripPrefix
              args:
                parts: 2

      # Global filters
      default-filters:
        - name: Retry
          args:
            retries: 3
            statuses: BAD_GATEWAY, SERVICE_UNAVAILABLE
            methods: GET, POST
            backoff:
              firstBackoff: 10ms
              maxBackoff: 50ms
              factor: 2
              basedOnPreviousValue: false

      # CORS Configuration
      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origins:
              - "http://localhost:3000"
              - "http://localhost:3001"
              - "http://localhost:3002"
              - "${FRONTEND_URL:http://localhost:3002}"
            allowed-methods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowed-headers:
              - "*"
            exposed-headers:
              - "X-Total-Count"
              - "X-RateLimit-Limit"
              - "X-RateLimit-Remaining"
              - "X-RateLimit-Reset"
            allow-credentials: true
            max-age: 3600

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:your-256-bit-secret-key-for-jwt-token-generation}
  expiration: ${JWT_EXPIRATION:86400000}  # 24 hours in milliseconds
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}  # 7 days in milliseconds
  issuer: bd-law-assistant

# Rate Limiting Configuration
rate-limit:
  enabled: true
  anonymous:
    limit: ${RATE_LIMIT_ANONYMOUS:10}
    duration: 60  # seconds
  authenticated:
    limit: ${RATE_LIMIT_AUTHENTICATED:100}
    duration: 60  # seconds
  premium:
    limit: ${RATE_LIMIT_PREMIUM:1000}
    duration: 60  # seconds

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus, caches
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}

# Logging Configuration
logging:
  level:
    root: INFO
    com.bdlaw.gateway: DEBUG
    org.springframework.cloud.gateway: DEBUG
    org.springframework.security: DEBUG
    org.springframework.web: INFO
    org.hibernate: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/gateway.log
    max-size: 10MB
    max-history: 10

# API Documentation
springdoc:
  api-docs:
    enabled: true
    path: /api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    try-it-out-enabled: true
    filter: true
    tags-sorter: alpha
    operations-sorter: method

# Security Configuration
security:
  ignored-paths:
    - /api-docs/**
    - /swagger-ui/**
    - /swagger-ui.html
    - /actuator/health/**
    - /api/auth/login
    - /api/auth/register
    - /api/auth/forgot-password

# Service URLs (can be overridden by environment variables)
services:
  rag:
    url: ${RAG_SERVICE_URL:http://localhost:8000}
    timeout: 30000
  user:
    url: ${USER_SERVICE_URL:http://localhost:8003}
    timeout: 10000
  scraping:
    url: ${SCRAPING_SERVICE_URL:http://localhost:8004}
    timeout: 60000